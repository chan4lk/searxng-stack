# SearXNG metasearch (keyless web search API) + Valkey cache.
# Bound to loopback only; searxng.sh exposes it to the tailnet via `tailscale serve`.
name: searxng

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8889}:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run ./searxng.sh up to generate .env}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }

volumes:
  valkey-data:
